<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager Dashboard | Nyota Electronics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert } from "../js/validation.js";
import { loadStats, listFeedbackPage, statusBadge, fmtDate, TYPE_LABEL } from "../js/dashboard.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["manager"]);
  const main = mountShell(profile, "dashboard");
  main.innerHTML = `
    <h1 class="ne-page-title">DASHBOARD</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <div class="ne-cards" id="row1"></div>
    <h2 class="ne-section-title">Awaiting assignment</h2>
    <div class="ne-panel"><div class="ne-table-wrap" id="queue"><p class="ne-empty">Loading...</p></div>
      <div class="mt-2"><a href="${esc(url("manager/assignments.html"))}">Open the assignment queue</a> &middot; <a href="${esc(url("manager/feedback.html"))}">View all feedback</a></div></div>`;
  const card = (n, label, cls = "") => `<div class="ne-card ${cls}"><div class="num">${esc(n)}</div><div class="lbl">${esc(label)}</div></div>`;
  const [stats, waiting] = await Promise.all([loadStats(), listFeedbackPage({ assignment: "unassigned", page: 1, size: 5 })]);
  if (!stats) showAlert(document.getElementById("alert"), "We could not load the dashboard numbers. Please refresh the page.");
  else document.getElementById("row1").innerHTML = card(stats.total, "Total") + card(stats.pending, "Pending", "red") + card(stats.in_progress, "In Progress", "amber") + card(stats.resolved, "Resolved", "green");
  document.getElementById("queue").innerHTML = !waiting.ok ? `<p class="ne-empty">Could not load the queue.</p>` : !waiting.rows.length ? `<p class="ne-empty">Every case has been assigned. Nothing is waiting.</p>`
    : `<table class="ne-table"><thead><tr><th>Reference</th><th>Customer</th><th>Type</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${waiting.rows.map((x) => `<tr><td>${esc(x.reference_number)}</td><td>${esc(x.customer_name)}</td><td>${esc(TYPE_LABEL[x.feedback_type] || x.feedback_type)}</td><td>${statusBadge(x.status)}</td><td>${esc(fmtDate(x.created_at))}</td><td><a class="btn-view" href="${esc(url("manager/feedback-details.html?id=" + encodeURIComponent(x.id)))}">Assign</a></td></tr>`).join("")}</tbody></table>
       ${waiting.total > waiting.rows.length ? `<p class="ne-note mt-2 mb-0">${waiting.total} cases are waiting.</p>` : ""}`;
}
</script>
</body>
</html>
