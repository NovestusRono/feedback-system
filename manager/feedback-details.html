<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Details | Nyota Electronics</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert, setBusy } from "../js/validation.js";
import { getStaffFeedbackDetail } from "../js/feedback.js";
import { renderCaseDetail, bindAttachments } from "../js/case-view.js";
import { loadAssignableEmployees, assignFeedback } from "../js/assignments.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["manager"]);
  const main = mountShell(profile, "feedback");
  const id = new URLSearchParams(location.search).get("id") || "";
  const back = `<a class="btn-ne-secondary" href="${esc(url("manager/feedback.html"))}">Close</a>`;
  let notice = "";

  async function render() {
    const d = /^[0-9a-f-]{36}$/i.test(id) ? await getStaffFeedbackDetail(id) : null;
    if (!d) { main.innerHTML = `<div class="ne-form-card text-center"><h1>Feedback not found</h1><p class="text-muted-ne">We could not find that feedback.</p>${back}</div>`; return; }
    main.innerHTML = `<h1 class="ne-page-title">FEEDBACK DETAILS</h1><div id="notice" class="alert d-none" role="alert"></div>${renderCaseDetail(d)}${back}`;
    if (notice) { showAlert(document.getElementById("notice"), notice, "success"); notice = ""; }
    bindAttachments();
    const f = d.feedback, cur = d.assignments.find((a) => !a.unassigned_at), panel = document.getElementById("actionPanel");
    if (f.status === "Resolved") { panel.innerHTML = `<div class="ne-panel mb-3"><p class="ne-note mb-0">This case is resolved and can no longer be assigned.</p></div>`; return; }
    const team = await loadAssignableEmployees();
    if (!team.ok || !team.rows.length) { panel.innerHTML = `<div class="ne-panel mb-3"><span class="ne-label">Assign</span><p class="text-muted-ne mb-0">${team.ok ? "There are no active employees to assign to. An administrator can create employee accounts." : "We could not load the team. Please refresh the page."}</p></div>`; return; }
    panel.innerHTML = `<div class="ne-panel mb-3"><form id="assignForm" novalidate>
      <span class="ne-label">${cur ? "Reassign this case" : "Assign this case"}</span>
      <div id="assignAlert" class="alert d-none" role="alert"></div>
      <div class="row g-3 align-items-end">
        <div class="col-md-5"><label class="form-label fw-bold" for="employee">Employee</label>
          <select class="form-select" id="employee" style="border:2px solid var(--ne-border)"><option value="">Choose an employee</option>
          ${team.rows.map((e) => `<option value="${esc(e.id)}" ${cur && cur.assigned_employee_id === e.id ? "disabled" : ""}>${esc(e.name)} (${esc(e.open)} open)${cur && cur.assigned_employee_id === e.id ? " - current" : ""}</option>`).join("")}</select></div>
        <div class="col-md-7"><label class="form-label fw-bold" for="note">Note <span class="text-muted-ne fw-normal">(optional)</span></label>
          <input class="form-control" id="note" maxlength="500" style="border:2px solid var(--ne-border)" placeholder="Anything the employee should know"></div>
      </div>
      <button class="btn btn-ne mt-3" id="assignBtn" type="submit">${cur ? "Reassign" : "Assign"}</button></form></div>`;
    document.getElementById("assignForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sel = document.getElementById("employee"), alertEl = document.getElementById("assignAlert"), btn = document.getElementById("assignBtn");
      if (!sel.value) return showAlert(alertEl, "Choose an employee first.");
      showAlert(alertEl, ""); setBusy(btn, true, "Saving...");
      const r = await assignFeedback(f.id, sel.value, document.getElementById("note").value);
      if (!r.ok) { setBusy(btn, false); return showAlert(alertEl, r.message); }
      notice = `Case ${f.reference_number} is now assigned to ${sel.options[sel.selectedIndex].textContent.replace(/ \(\d+ open\).*$/, "")}.`;
      await render();
    });
  }
  await render();
}
</script>
</body>
</html>
