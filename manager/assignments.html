<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignments | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
<script src="../assets/boot-check.js"></script>
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc } from "../js/validation.js";
import { mountFeedbackManagement } from "../js/dashboard.js";
import { loadAssignableEmployees } from "../js/assignments.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["manager"]);
  const main = mountShell(profile, "assignments");
  main.innerHTML = `<div id="queue"></div><h2 class="ne-section-title">Team workload</h2><div class="ne-panel"><div class="ne-table-wrap" id="workload"><p class="ne-empty">Loading...</p></div></div>`;
  const queue = document.createElement("div");
  document.getElementById("queue").appendChild(queue);
  await mountFeedbackManagement(queue, { detailsPath: "manager/feedback-details.html", title: "AWAITING ASSIGNMENT", defaultAssignment: "unassigned", lockAssignment: true });
  const w = await loadAssignableEmployees();
  document.getElementById("workload").innerHTML = !w.ok ? `<p class="ne-empty">Could not load the team.</p>` : !w.rows.length ? `<p class="ne-empty">There are no active employees yet. An administrator can create employee accounts.</p>`
    : `<table class="ne-table"><thead><tr><th>Employee</th><th>Open cases</th></tr></thead><tbody>${w.rows.map((e) => `<tr><td>${esc(e.name)}</td><td>${esc(e.open)}</td></tr>`).join("")}</tbody></table>`;
}
</script>
</body>
</html>
