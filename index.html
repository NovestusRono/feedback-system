<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyota Electronics - Feedback Portal</title>
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<script src="assets/boot-check.js"></script>
</head>
<body>
<div class="ne-public">
  <header class="ne-header">
    <a class="ne-brand" href="index.html">NYOTA ELECTRONICS</a>
    <nav aria-label="Main"><a class="active" href="index.html">Home</a><span aria-disabled="true" title="Coming soon">About</span><span aria-disabled="true" title="Coming soon">Help</span></nav>
  </header>
  <main class="ne-hero">
    <h1>WE VALUE YOUR FEEDBACK</h1>
    <p>Help us improve our products and services.</p>
    <div class="d-flex flex-wrap justify-content-center gap-2 mt-2">
      <a class="btn btn-ne" id="cta" href="customer/login.html?next=customer%2Fsubmit.html">Submit Feedback</a>
      <a class="btn btn-ne-secondary" id="anon" href="customer/anonymous.html">Submit Anonymously</a>
    </div>
    <div class="ne-types"><span>Complaints</span><span>Compliments</span><span>Suggestions</span></div>
  </main>
  <footer class="ne-footer">
    &copy; 2026 Nyota Electronics<br>
    <a href="customer/login.html">Customer login</a> | <a href="staff/login.html">Staff login</a>
  </footer>
</div>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
// Signed-in customers go straight to the form; everyone else is sent to log in first.
import { backendProblem } from "./js/supabase-client.js";
import { getProfile, url } from "./js/auth.js";
try {
  if (!backendProblem()) {
    const p = await getProfile();
    if (p && p.account_status === "active" && p.role === "customer") document.getElementById("cta").href = url("customer/submit.html");
  }
} catch (_) { /* keep the login link */ }
</script>
</body>
</html>
