<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audit Logs | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
<script src="../assets/boot-check.js"></script>
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc } from "../js/validation.js";
import { fmtDateTime } from "../js/dashboard.js";
import { listAuditLogs } from "../js/user-management.js";

const ACTIONS = {
  feedback_assigned: "Feedback assigned", feedback_reassigned: "Feedback reassigned", status_changed: "Status changed", response_added: "Response added",
  feedback_resolved: "Feedback resolved", role_changed: "Role changed", account_status_changed: "Account status changed",
  staff_created: "Staff account created", setting_changed: "Setting changed",
  report_generated: "Report generated", report_exported: "Report exported", report_printed: "Report printed",
};
const label = (a) => ACTIONS[a] || String(a).replace(/_/g, " ");
// Metadata is shown as short key: value pairs. Every value is escaped; long values are cut.
const details = (m) => Object.entries(m || {}).slice(0, 6).map(([k, v]) => `${esc(k)}: ${esc(typeof v === "object" ? JSON.stringify(v) : String(v).slice(0, 80))}`).join("; ");

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const me = await requireRole(["administrator"]);
  const main = mountShell(me, "audit");
  const PAGE = 20, state = { action: "", page: 1 };
  main.innerHTML = `
    <h1 class="ne-page-title">AUDIT LOGS</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <div class="ne-panel">
      <form class="ne-filters" id="filters"><span><label for="fAction">Action:</label><select class="form-select d-inline-block" id="fAction"><option value="">All</option>${Object.entries(ACTIONS).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join("")}</select></span></form>
      <div class="ne-table-wrap" id="tableWrap"><p class="ne-empty">Loading...</p></div>
      <div class="ne-pager" id="pager"></div>
    </div>`;
  const $ = (id) => document.getElementById(id);
  let token = 0;
  async function load() {
    const mine = ++token;
    const r = await listAuditLogs({ ...state, size: PAGE });
    if (mine !== token) return;
    if (!r.ok) { $("alert").className = "alert alert-danger"; $("alert").textContent = "We could not load the audit log."; $("tableWrap").innerHTML = ""; $("pager").innerHTML = ""; return; }
    $("alert").className = "d-none";
    const pages = Math.max(1, Math.ceil(r.total / PAGE));
    if (!r.rows.length && state.page > 1) { state.page = 1; return load(); }
    if (!r.rows.length) { $("tableWrap").innerHTML = `<p class="ne-empty">No audit entries found.</p>`; $("pager").innerHTML = ""; return; }
    $("tableWrap").innerHTML = `<table class="ne-table"><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Details</th></tr></thead><tbody>${
      r.rows.map((x) => `<tr><td>${esc(fmtDateTime(x.created_at))}</td><td>${esc(x.actor_name)}</td><td>${esc(label(x.action))}</td><td class="ne-meta">${details(x.metadata)}</td></tr>`).join("")}</tbody></table>`;
    $("pager").innerHTML = `<span class="text-muted-ne">${r.total} entr${r.total === 1 ? "y" : "ies"}</span>${pages > 1 ? `<span><button class="btn btn-sm btn-ne-secondary" id="prev" ${state.page === 1 ? "disabled" : ""}>Previous</button> <span class="mx-2">Page ${state.page} of ${pages}</span> <button class="btn btn-sm btn-ne-secondary" id="next" ${state.page === pages ? "disabled" : ""}>Next</button></span>` : ""}`;
    $("prev")?.addEventListener("click", () => { state.page--; load(); });
    $("next")?.addEventListener("click", () => { state.page++; load(); });
  }
  $("fAction").addEventListener("change", () => { state.action = $("fAction").value; state.page = 1; load(); });
  await load();
}
</script>
</body>
</html>
