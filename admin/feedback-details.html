<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Details | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc } from "../js/validation.js";
import { getStaffFeedbackDetail } from "../js/feedback.js";
import { renderCaseDetail, bindAttachments } from "../js/case-view.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["administrator"]);
  const main = mountShell(profile, "feedback");
  const id = new URLSearchParams(location.search).get("id") || "";
  const d = /^[0-9a-f-]{36}$/i.test(id) ? await getStaffFeedbackDetail(id) : null;
  const close = `<a class="btn-ne-secondary" href="${esc(url("admin/feedback.html"))}">Close</a>`;
  if (!d) {
    main.innerHTML = `<div class="ne-form-card text-center"><h1>Feedback not found</h1><p class="text-muted-ne">We could not find that feedback.</p>${close}</div>`;
  } else {
    main.innerHTML = `<h1 class="ne-page-title">FEEDBACK DETAILS</h1>${renderCaseDetail(d)}${close}`;
    document.getElementById("actionPanel").innerHTML = `<p class="ne-note">Administrators have read-only access to cases. Managers assign work and employees resolve it.</p>`;
    bindAttachments();
  }
}
</script>
</body>
</html>
