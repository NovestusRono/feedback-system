<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Dashboard | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
<script src="../assets/boot-check.js"></script>
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script src="../assets/vendor/chart.umd.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert } from "../js/validation.js";
import { loadStats, listFeedbackPage, statusBadge, fmtDate, TYPE_LABEL } from "../js/dashboard.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["administrator"]);
  const main = mountShell(profile, "dashboard");
  main.innerHTML = `
    <h1 class="ne-page-title">DASHBOARD</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <div class="ne-cards" id="row1"></div>
    <div class="ne-cards" id="row2"></div>
    <div class="ne-charts">
      <section class="ne-chart-box"><h2>Feedback Trend <span class="ne-note fw-normal">(last 30 days)</span></h2><div class="ne-chart-canvas"><canvas id="trend" role="img" aria-label="Line chart of feedback submitted per day over the last 30 days"></canvas></div></section>
      <section class="ne-chart-box"><h2>By Category</h2><div class="ne-chart-canvas"><canvas id="byType" role="img" aria-label="Doughnut chart of feedback by type"></canvas></div></section>
    </div>
    <h2 class="ne-section-title">Recent Feedback</h2>
    <div class="ne-panel"><div class="ne-table-wrap" id="recent"><p class="ne-empty">Loading...</p></div>
      <div class="mt-2"><a href="${esc(url("admin/feedback.html"))}">View all feedback</a></div></div>`;
  const $ = (id) => document.getElementById(id);
  const card = (n, label, cls = "") => `<div class="ne-card ${cls}"><div class="num">${esc(n)}</div><div class="lbl">${esc(label)}</div></div>`;

  const [stats, recent] = await Promise.all([loadStats(), listFeedbackPage({ page: 1, size: 5 })]);
  if (!stats) {
    showAlert($("alert"), "We could not load the dashboard numbers. Please refresh the page.");
  } else {
    $("row1").innerHTML = card(stats.total, "Total") + card(stats.complaints, "Complaints", "red") + card(stats.compliments, "Compliments", "green") + card(stats.suggestions, "Suggestions", "amber");
    $("row2").innerHTML = card(stats.pending, "Pending", "red") + card(stats.in_progress, "In Progress", "amber") + card(stats.resolved, "Resolved", "green") + card(stats.avg_rating == null ? "n/a" : `${stats.avg_rating} / 5`, "Avg. Rating");
    if (window.Chart) {
      const css = getComputedStyle(document.documentElement);
      const c = (v) => css.getPropertyValue(v).trim();
      const days = stats.trend || [];
      new Chart($("trend"), {
        type: "line",
        data: { labels: days.map((d) => d.day.slice(5)), datasets: [{ data: days.map((d) => d.count), borderColor: c("--ne-amber"), backgroundColor: "rgba(232,163,61,.15)", fill: true, tension: .3, pointBackgroundColor: c("--ne-navy"), pointRadius: 3 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { precision: 0 } }, x: { ticks: { maxTicksLimit: 8 } } } },
      });
      new Chart($("byType"), {
        type: "doughnut",
        data: { labels: ["Complaints", "Compliments", "Suggestions"], datasets: [{ data: [stats.complaints, stats.compliments, stats.suggestions], backgroundColor: [c("--ne-red"), c("--ne-green"), c("--ne-amber")], borderWidth: 2 }] },
        options: { maintainAspectRatio: false, plugins: { legend: { position: "bottom" } }, cutout: "60%" },
      });
    }
  }
  $("recent").innerHTML = !recent.ok ? `<p class="ne-empty">Could not load recent feedback.</p>` : !recent.rows.length ? `<p class="ne-empty">No feedback has been submitted yet.</p>`
    : `<table class="ne-table"><thead><tr><th>Reference</th><th>Type</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${recent.rows.map((x) => `<tr><td>${esc(x.reference_number)}</td><td>${esc(TYPE_LABEL[x.feedback_type] || x.feedback_type)}</td><td>${statusBadge(x.status)}</td><td>${esc(fmtDate(x.created_at))}</td><td><a class="btn-view" href="${esc(url("admin/feedback-details.html?id=" + encodeURIComponent(x.id)))}">View</a></td></tr>`).join("")}</tbody></table>`;
}
</script>
</body>
</html>
