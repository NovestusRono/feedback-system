# Publishes the static site to GitHub Pages. Tests, docs-only folders and Supabase sources are not published.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refuse to publish secrets or an unconfigured backend
        run: node scripts/check-release.mjs
      - name: Assemble site
        run: |
          mkdir _site
          cp -r index.html forgot-password.html reset-password.html 404.html .nojekyll assets js customer staff admin manager employee _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
