<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
<script src="../assets/boot-check.js"></script>
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert, setBusy } from "../js/validation.js";
import { getStaffFeedbackDetail } from "../js/feedback.js";
import { renderCaseDetail, bindAttachments } from "../js/case-view.js";
import { startCase, addResponse, resolveCase, loadMinResolutionLength } from "../js/responses.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["employee"]);
  const main = mountShell(profile, "assigned");
  const id = new URLSearchParams(location.search).get("id") || "";
  const back = `<a class="btn-ne-secondary" href="${esc(url("employee/assigned.html"))}">Close</a>`;
  const minLen = await loadMinResolutionLength();
  let notice = "";
  const $ = (x) => document.getElementById(x);

  async function render() {
    const d = /^[0-9a-f-]{36}$/i.test(id) ? await getStaffFeedbackDetail(id) : null;
    // RLS returns nothing unless the case is assigned to this employee.
    if (!d) { main.innerHTML = `<div class="ne-form-card text-center"><h1>Case not found</h1><p class="text-muted-ne">We could not find that case, or it is not assigned to you.</p>${back}</div>`; return; }
    main.innerHTML = `<h1 class="ne-page-title">CASE DETAILS</h1><div id="notice" class="alert d-none" role="alert"></div>${renderCaseDetail(d)}${back}`;
    if (notice) { showAlert($("notice"), notice, "success"); notice = ""; }
    bindAttachments();
    const f = d.feedback, panel = $("actionPanel");

    if (f.status === "Resolved") { panel.innerHTML = `<div class="ne-panel mb-3"><p class="ne-note mb-0">This case is resolved. No further changes can be made.</p></div>`; return; }

    if (f.status === "Pending") {
      panel.innerHTML = `<div class="ne-panel mb-3"><form id="startForm"><span class="ne-label">Start working on this case</span>
        <div id="startAlert" class="alert d-none" role="alert"></div>
        <label class="form-label fw-bold" for="startNote">Note <span class="text-muted-ne fw-normal">(optional)</span></label>
        <input class="form-control mb-3" id="startNote" maxlength="500" style="border:2px solid var(--ne-border)">
        <button class="btn btn-ne" id="startBtn" type="submit">Start work</button></form></div>`;
      $("startForm").addEventListener("submit", async (e) => {
        e.preventDefault(); setBusy($("startBtn"), true, "Saving...");
        const r = await startCase(f.id, $("startNote").value);
        if (!r.ok) { setBusy($("startBtn"), false); return showAlert($("startAlert"), r.message); }
        notice = "The case is now In Progress. The customer has been notified."; await render();
      });
      return;
    }

    // In Progress: respond, or resolve.
    panel.innerHTML = `
      <div class="ne-panel mb-3"><form id="respForm" novalidate><span class="ne-label">Add a response or note</span>
        <div id="respAlert" class="alert d-none" role="alert"></div>
        <textarea class="form-control mb-2" id="respText" rows="3" maxlength="4000" aria-label="Response text" style="border:2px solid var(--ne-border)"></textarea>
        <div class="d-flex flex-wrap gap-3 mb-3">
          <div class="form-check"><input class="form-check-input" type="radio" name="vis" id="visCustomer" value="customer" checked><label class="form-check-label" for="visCustomer">Visible to the customer</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="vis" id="visInternal" value="internal"><label class="form-check-label" for="visInternal">Internal note (staff only)</label></div>
        </div>
        <button class="btn btn-ne" id="respBtn" type="submit">Add response</button></form></div>
      <div class="ne-panel mb-3"><form id="resolveForm" novalidate><span class="ne-label">Resolve this case</span>
        <div id="resolveAlert" class="alert d-none" role="alert"></div>
        <label class="form-label fw-bold" for="details">Resolution details <span class="text-danger">*</span> <span class="text-muted-ne fw-normal">(at least ${esc(minLen)} characters; shown to the customer)</span></label>
        <textarea class="form-control mb-3" id="details" rows="4" maxlength="4000" style="border:2px solid var(--ne-border)"></textarea>
        <label class="form-label fw-bold" for="custMsg">Message to the customer <span class="text-muted-ne fw-normal">(optional)</span></label>
        <textarea class="form-control mb-3" id="custMsg" rows="2" maxlength="4000" style="border:2px solid var(--ne-border)"></textarea>
        <label class="form-label fw-bold" for="intNote">Internal note <span class="text-muted-ne fw-normal">(optional)</span></label>
        <textarea class="form-control mb-3" id="intNote" rows="2" maxlength="4000" style="border:2px solid var(--ne-border)"></textarea>
        <button class="btn btn-ne" id="resolveBtn" type="submit">Mark as resolved</button></form></div>`;

    $("respForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = $("respText").value.trim();
      if (!text) return showAlert($("respAlert"), "Enter a message first.");
      setBusy($("respBtn"), true, "Saving...");
      const r = await addResponse(f.id, text, document.querySelector("input[name=vis]:checked").value);
      if (!r.ok) { setBusy($("respBtn"), false); return showAlert($("respAlert"), r.message); }
      notice = "Response added."; await render();
    });
    $("resolveForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const details = $("details").value.trim();
      if (details.length < minLen) return showAlert($("resolveAlert"), `Resolution details must be at least ${minLen} characters.`);
      if (!window.confirm("Mark this case as resolved? This cannot be undone.")) return;
      setBusy($("resolveBtn"), true, "Saving...");
      const r = await resolveCase(f.id, { details, customerResponse: $("custMsg").value, internalNote: $("intNote").value });
      if (!r.ok) { setBusy($("resolveBtn"), false); return showAlert($("resolveAlert"), r.message); }
      notice = "The case has been resolved and the customer notified."; await render();
    });
  }
  await render();
}
</script>
</body>
</html>
