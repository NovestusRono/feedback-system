<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Assigned Feedback | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert } from "../js/validation.js";
import { listAssignedToMe } from "../js/assignments.js";
import { TYPE_LABEL, STATUSES, statusBadge, fmtDate } from "../js/dashboard.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["employee"]);
  const main = mountShell(profile, "assigned");
  const PAGE = 10;
  main.innerHTML = `
    <h1 class="ne-page-title">MY ASSIGNED FEEDBACK</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <div class="ne-panel">
      <form class="ne-filters" id="filters" role="search">
        <input class="form-control" id="q" type="search" placeholder="Search reference, subject or customer..." aria-label="Search" maxlength="100">
        <button class="btn btn-ne py-2" type="submit">Search</button>
        <span><label for="fStatus">Status:</label><select class="form-select d-inline-block" id="fStatus"><option value="">All</option>${STATUSES.map((s) => `<option>${s}</option>`).join("")}</select></span>
      </form>
      <div class="ne-table-wrap" id="tableWrap"><p class="ne-empty">Loading...</p></div>
      <div class="ne-pager" id="pager"></div>
    </div>`;
  const $ = (id) => document.getElementById(id);
  let all = [], page = 1;
  const filtered = () => { const q = $("q").value.trim().toLowerCase(), s = $("fStatus").value;
    return all.filter((r) => (!q || [r.reference_number, r.subject, r.customer_name].some((v) => v.toLowerCase().includes(q))) && (!s || r.status === s)); };
  const render = () => {
    const rows = filtered(), pages = Math.max(1, Math.ceil(rows.length / PAGE)); page = Math.min(page, pages);
    if (!all.length) { $("tableWrap").innerHTML = `<p class="ne-empty">No feedback has been assigned to you yet.</p>`; $("pager").innerHTML = ""; return; }
    if (!rows.length) { $("tableWrap").innerHTML = `<p class="ne-empty">No feedback matches your search.</p>`; $("pager").innerHTML = ""; return; }
    $("tableWrap").innerHTML = `<table class="ne-table"><thead><tr><th>Reference</th><th>Customer</th><th>Type</th><th>Subject</th><th>Status</th><th>Date</th><th>Action</th></tr></thead><tbody>${rows.slice((page - 1) * PAGE, page * PAGE).map((x) => `<tr><td>${esc(x.reference_number)}</td><td>${esc(x.customer_name)}</td><td>${esc(TYPE_LABEL[x.feedback_type] || x.feedback_type)}</td><td>${esc(x.subject)}</td><td>${statusBadge(x.status)}</td><td>${esc(fmtDate(x.created_at))}</td><td><a class="btn-view" href="${esc(url("employee/case.html?id=" + encodeURIComponent(x.id)))}">Open</a></td></tr>`).join("")}</tbody></table>`;
    $("pager").innerHTML = `<span class="text-muted-ne">${rows.length} item${rows.length === 1 ? "" : "s"}</span>${pages > 1 ? `<span><button class="btn btn-sm btn-ne-secondary" id="prev" ${page === 1 ? "disabled" : ""}>Previous</button> <span class="mx-2">Page ${page} of ${pages}</span> <button class="btn btn-sm btn-ne-secondary" id="next" ${page === pages ? "disabled" : ""}>Next</button></span>` : ""}`;
    $("prev")?.addEventListener("click", () => { page--; render(); }); $("next")?.addEventListener("click", () => { page++; render(); });
  };
  $("filters").addEventListener("submit", (e) => { e.preventDefault(); page = 1; render(); });
  $("fStatus").addEventListener("change", () => { page = 1; render(); });
  const r = await listAssignedToMe();
  if (!r.ok) showAlert($("alert"), "We could not load your cases. Please refresh the page.");
  all = r.rows; render();
}
</script>
</body>
</html>
