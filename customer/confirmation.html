<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback Submitted | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
<script src="../assets/boot-check.js"></script>
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { sb, backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc } from "../js/validation.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["customer"]);
  const main = mountShell(profile, "submit");
  const id = new URLSearchParams(location.search).get("id") || "";
  // The reference is read back from the database (RLS: only the owner can see it), never taken from the URL.
  const { data } = /^[0-9a-f-]{36}$/i.test(id)
    ? await sb.from("feedback").select("id, reference_number").eq("id", id).maybeSingle()
    : { data: null };
  let errs = [];
  try { errs = JSON.parse(sessionStorage.getItem("ne_attach_errors") || "[]"); sessionStorage.removeItem("ne_attach_errors"); } catch (_) {}
  if (!data) {
    main.innerHTML = `<div class="ne-form-card text-center"><h1>Feedback not found</h1><p class="text-muted-ne">We could not find that submission.</p>
      <a class="btn btn-ne" href="${esc(url("customer/dashboard.html"))}">My Feedback</a></div>`;
  } else {
    main.innerHTML = `<div class="ne-form-card text-center">
      <div class="ne-success-circle" aria-hidden="true">&#10003;</div>
      <h1 class="mb-2">Feedback Submitted Successfully</h1>
      <p class="text-muted-ne fs-5 mb-2">Your Reference Number is:</p>
      <div class="ne-ref" id="ref">${esc(data.reference_number)}</div>
      <p class="text-muted-ne mt-4">Please keep this number for future reference.</p>
      ${errs.length ? `<div class="alert alert-warning text-start" role="alert">Your feedback was saved, but some attachments could not be uploaded:<ul class="mb-0">${errs.map((m) => `<li>${esc(m)}</li>`).join("")}</ul></div>` : ""}
      <a class="btn btn-ne mt-2" href="${esc(url("index.html"))}">Return Home</a>
    </div>`;
  }
}
</script>
</body>
</html>
