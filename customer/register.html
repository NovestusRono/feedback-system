<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create Customer Account</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<div class="ne-auth-wrap"><div class="ne-auth-card">
  <div class="ne-logo" aria-hidden="true">NE</div>
  <h1>NYOTA ELECTRONICS</h1>
  <p class="subtitle">Create your customer account</p>
  <div id="alert" class="alert d-none" role="alert"></div>
  <form id="form" novalidate>
    <div class="row g-3 mb-3">
      <div class="col-sm-6"><label class="form-label" for="first">First name</label>
        <input class="form-control" id="first" autocomplete="given-name" maxlength="60" required></div>
      <div class="col-sm-6"><label class="form-label" for="last">Last name</label>
        <input class="form-control" id="last" autocomplete="family-name" maxlength="60" required></div>
    </div>
    <div class="mb-3"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" type="email" autocomplete="email" maxlength="254" required></div>
    <div class="mb-3"><label class="form-label" for="phone">Phone <span class="text-muted-ne fw-normal">(optional)</span></label>
      <input class="form-control" id="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="e.g. 0712 345 678"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" autocomplete="new-password" maxlength="72" required>
      <div class="form-text">At least 8 characters, with a letter and a number.</div></div>
    <div class="mb-4"><label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control" id="confirm" type="password" autocomplete="new-password" maxlength="72" required></div>
    <button class="btn btn-ne" id="submit" type="submit">Create account</button>
  </form>
  <div class="ne-auth-links"><a href="login.html">Already registered? Login</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { signUpCustomer, redirectIfSignedIn, safeNext, url } from "../js/auth.js";
import { isEmail, validateName, validatePassword, validatePhone, showAlert, setBusy, setFieldError } from "../js/validation.js";
const $ = (id) => document.getElementById(id);
const alertEl = $("alert"), btn = $("submit");
const problem = backendProblem();
if (problem) { showAlert(alertEl, problem, "warning"); btn.disabled = true; }
else await redirectIfSignedIn();
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = { first: $("first").value, last: $("last").value, email: $("email").value.trim(), phone: $("phone").value, pw: $("password").value, cf: $("confirm").value };
  const errs = {
    first: validateName(v.first, "First name"), last: validateName(v.last, "Last name"),
    email: isEmail(v.email) ? "" : "Enter a valid email address.", phone: validatePhone(v.phone),
    password: validatePassword(v.pw), confirm: v.pw === v.cf ? "" : "Passwords do not match.",
  };
  for (const [k, m] of Object.entries(errs)) setFieldError($(k), m);
  if (Object.values(errs).some(Boolean)) return showAlert(alertEl, "Please fix the highlighted fields.");
  showAlert(alertEl, ""); setBusy(btn, true, "Creating account...");
  const r = await signUpCustomer({ firstName: v.first, lastName: v.last, email: v.email, phone: v.phone, password: v.pw });
  if (!r.ok) { setBusy(btn, false); return showAlert(alertEl, r.message); }
  if (r.needsConfirmation) {
    $("form").classList.add("d-none");
    return showAlert(alertEl, "Almost done. Check your email for a confirmation link, then log in.", "success");
  }
  location.replace(url(safeNext(new URLSearchParams(location.search).get("next")) || "customer/dashboard.html"));
});
</script>
</body>
</html>
