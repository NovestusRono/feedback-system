<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit Feedback | Nyota Electronics</title>
<link href="../assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="guard-pending">
<div id="shell-root"></div>
<noscript><p class="p-4">JavaScript is required.</p></noscript>
<script src="../assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { requireRole, url } from "../js/auth.js";
import { mountShell } from "../js/navigation.js";
import { esc, showAlert, setBusy, setFieldError } from "../js/validation.js";
import { loadFormOptions, validateFeedback, checkFile, submitFeedback } from "../js/feedback.js";

if (backendProblem()) { document.body.classList.remove("guard-pending"); document.body.textContent = backendProblem(); }
else {
  const profile = await requireRole(["customer"]);
  const main = mountShell(profile, "submit");
  const opts = await loadFormOptions();
  const fullName = `${profile.first_name || ""} ${profile.last_name || ""}`.trim();
  const mb = Math.round(opts.limits.maxBytes / 1048576);
  main.innerHTML = `
  <div class="ne-form-card">
    <h1>SUBMIT FEEDBACK</h1>
    <div id="alert" class="alert d-none" role="alert"></div>
    <form id="form" novalidate>
      <div class="row g-3 mb-3">
        <div class="col-md-6"><label class="form-label" for="fullName">Full Name</label>
          <input class="form-control" id="fullName" value="${esc(fullName)}" readonly></div>
        <div class="col-md-6"><label class="form-label" for="phone">Phone Number</label>
          <input class="form-control" id="phone" value="${esc(profile.phone || "")}" placeholder="Not set on your account" readonly></div>
      </div>
      <div class="mb-4"><label class="form-label" for="email">Email Address</label>
        <input class="form-control" id="email" value="${esc(profile.email)}" readonly></div>

      <fieldset class="mb-4"><legend>Feedback Type</legend>
        <div class="ne-radios">
          <div class="form-check"><input class="form-check-input" type="radio" name="type" id="t-complaint" value="complaint" checked><label class="form-check-label" for="t-complaint">Complaint</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="type" id="t-compliment" value="compliment"><label class="form-check-label" for="t-compliment">Compliment</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="type" id="t-suggestion" value="suggestion"><label class="form-check-label" for="t-suggestion">Suggestion</label></div>
        </div>
      </fieldset>

      <div class="mb-4"><label class="form-label" for="subject">Subject</label>
        <input class="form-control" id="subject" maxlength="150" placeholder="Brief title of your feedback" required></div>

      <div class="mb-4"><label class="form-label" for="description">Description</label>
        <textarea class="form-control" id="description" rows="6" maxlength="4000" placeholder="Describe your experience in detail..." required></textarea>
        <div class="ne-counter"><span id="count">0</span> / 4000</div></div>

      <fieldset class="mb-4" id="ratingBox"><legend>How would you rate our service?</legend>
        <div class="ne-stars" id="stars">
          ${[5, 4, 3, 2, 1].map((n) => `<input type="radio" name="rating" id="r${n}" value="${n}"><label for="r${n}" title="${n} out of 5" aria-label="${n} out of 5">&#9733;</label>`).join("")}
        </div>
        <div class="invalid-feedback d-block" id="ratingErr"></div>
      </fieldset>

      <div class="row g-3 mb-4">
        <div class="col-md-6"><label class="form-label" for="servedBy">Who served you? <span class="text-muted-ne fw-normal">(optional)</span></label>
          <select class="form-select" id="servedBy"><option value="">I don't know / not applicable</option>
            ${opts.employees.map((e) => `<option value="${esc(e.id)}">${esc(e.first_name)}</option>`).join("")}</select></div>
        ${opts.categories.length ? `<div class="col-md-6"><label class="form-label" for="category">Product / service category <span class="text-muted-ne fw-normal">(optional)</span></label>
          <select class="form-select" id="category"><option value="">Select a category</option>
            ${opts.categories.map((c) => `<option>${esc(c)}</option>`).join("")}</select></div>` : ""}
        <div class="col-md-6"><label class="form-label" for="productName">Product name <span class="text-muted-ne fw-normal">(optional)</span></label>
          <input class="form-control" id="productName" maxlength="150"></div>
        <div class="col-md-6"><label class="form-label" for="purchaseRef">Receipt / order number <span class="text-muted-ne fw-normal">(optional)</span></label>
          <input class="form-control" id="purchaseRef" maxlength="100"></div>
        <div class="col-md-6"><label class="form-label" for="method">How should we respond?</label>
          <select class="form-select" id="method"><option value="email">Email</option><option value="phone">Phone call</option><option value="sms">SMS</option><option value="whatsapp">WhatsApp</option></select></div>
      </div>

      <div class="mb-4"><label class="form-label" for="files">Attachment <span class="text-muted-ne fw-normal">(optional, up to ${opts.limits.maxFiles} files, JPG/PNG/PDF, ${mb} MB each)</span></label>
        <input class="form-control" id="files" type="file" multiple accept=".jpg,.jpeg,.png,.pdf,image/jpeg,image/png,application/pdf">
        <ul class="ne-file-list" id="fileList"></ul></div>

      <div class="text-center"><button class="btn btn-ne px-5" id="submit" type="submit">Submit Feedback</button></div>
    </form>
  </div>`;

  const $ = (id) => document.getElementById(id);
  const alertEl = $("alert");
  let files = [];

  $("description").addEventListener("input", () => { $("count").textContent = $("description").value.length; });

  const renderFiles = () => {
    $("fileList").innerHTML = files.map((f, i) => `<li><span>${esc(f.name)}</span><button type="button" data-i="${i}" aria-label="Remove ${esc(f.name)}">Remove</button></li>`).join("");
  };
  $("fileList").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-i]"); if (!b) return;
    files.splice(Number(b.dataset.i), 1); renderFiles();
  });
  $("files").addEventListener("change", async () => {
    const picked = [...$("files").files]; $("files").value = "";
    const problems = [];
    for (const f of picked) {
      if (files.length >= opts.limits.maxFiles) { problems.push(`Only ${opts.limits.maxFiles} files are allowed.`); break; }
      const err = await checkFile(f, opts.limits);
      if (err) problems.push(err); else files.push(f);
    }
    renderFiles();
    showAlert(alertEl, problems.join(" "), "warning");
  });

  $("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = {
      type: document.querySelector("input[name=type]:checked")?.value, subject: $("subject").value, description: $("description").value,
      rating: document.querySelector("input[name=rating]:checked")?.value, servedBy: $("servedBy").value,
      category: $("category")?.value || "", productName: $("productName").value, purchaseRef: $("purchaseRef").value, method: $("method").value,
    };
    const errs = validateFeedback(f);
    setFieldError($("subject"), errs.subject); setFieldError($("description"), errs.description);
    setFieldError($("productName"), errs.productName); setFieldError($("purchaseRef"), errs.purchaseRef);
    $("ratingErr").textContent = errs.rating || "";
    if (Object.keys(errs).length) { showAlert(alertEl, "Please fix the highlighted fields."); return; }
    showAlert(alertEl, ""); setBusy($("submit"), true, "Submitting...");
    const r = await submitFeedback(profile.id, f, files);
    if (!r.ok) { setBusy($("submit"), false); showAlert(alertEl, r.message); return; }
    if (r.attachmentErrors.length) sessionStorage.setItem("ne_attach_errors", JSON.stringify(r.attachmentErrors));
    location.replace(url(`customer/confirmation.html?id=${encodeURIComponent(r.id)}`));
  });
}
</script>
</body>
</html>
