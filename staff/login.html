<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff / Admin Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
<link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<div class="ne-auth-wrap"><div class="ne-auth-card">
  <div class="ne-logo" aria-hidden="true">NE</div>
  <h1>NYOTA ELECTRONICS</h1>
  <p class="subtitle">Feedback Management System</p>
  <div id="alert" class="alert d-none" role="alert"></div>
  <form id="form" novalidate>
    <div class="mb-3">
      <label class="form-label" for="email">Work email</label>
      <input class="form-control" id="email" type="email" autocomplete="username" placeholder="Enter your work email" maxlength="254" required>
    </div>
    <div class="mb-4">
      <label class="form-label" for="password">Password</label>
      <input class="form-control" id="password" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="72" required>
    </div>
    <button class="btn btn-ne" id="submit" type="submit">Login</button>
  </form>
  <div class="ne-auth-links"><a href="../forgot-password.html?from=staff">Forgot Password?</a></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script type="module">
import { backendProblem } from "../js/supabase-client.js";
import { signIn, redirectIfSignedIn, safeNext, url } from "../js/auth.js";
import { ROLE_HOME } from "../js/permissions.js";
import { isEmail, showAlert, setBusy } from "../js/validation.js";
const alertEl = document.getElementById("alert"), btn = document.getElementById("submit");
const problem = backendProblem();
if (problem) { showAlert(alertEl, problem, "warning"); btn.disabled = true; }
else await redirectIfSignedIn();
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim(), password = document.getElementById("password").value;
  if (!isEmail(email) || !password) return showAlert(alertEl, "Enter your work email and password.");
  showAlert(alertEl, ""); setBusy(btn, true, "Signing in...");
  const r = await signIn(email, password, "staff");
  if (!r.ok) { setBusy(btn, false); return showAlert(alertEl, r.message); }
  const next = safeNext(new URLSearchParams(location.search).get("next"));
  location.replace(url(next || ROLE_HOME[r.profile.role]));
});
</script>
</body>
</html>
