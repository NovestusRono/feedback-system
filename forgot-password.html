<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password</title>
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
<script src="assets/boot-check.js"></script>
</head>
<body>
<div class="ne-auth-wrap"><div class="ne-auth-card">
  <div class="ne-logo" aria-hidden="true">NE</div>
  <h1>NYOTA ELECTRONICS</h1>
  <p class="subtitle">Reset your password</p>
  <div id="alert" class="alert d-none" role="alert"></div>
  <form id="form" novalidate>
    <div class="mb-4"><label class="form-label" for="email">Email</label>
      <input class="form-control" id="email" type="email" autocomplete="email" placeholder="Enter your account email" maxlength="254" required></div>
    <button class="btn btn-ne" id="submit" type="submit">Send reset link</button>
  </form>
  <div class="ne-auth-links"><a id="back" href="customer/login.html">Back to login</a></div>
</div></div>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
import { backendProblem } from "./js/supabase-client.js";
import { requestPasswordReset } from "./js/auth.js";
import { isEmail, showAlert, setBusy } from "./js/validation.js";
const alertEl = document.getElementById("alert"), btn = document.getElementById("submit");
if (new URLSearchParams(location.search).get("from") === "staff") document.getElementById("back").href = "staff/login.html";
const problem = backendProblem();
if (problem) { showAlert(alertEl, problem, "warning"); btn.disabled = true; }
document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!isEmail(email)) return showAlert(alertEl, "Enter a valid email address.");
  setBusy(btn, true, "Sending...");
  const r = await requestPasswordReset(email);
  setBusy(btn, false);
  if (!r.ok) return showAlert(alertEl, r.message);
  showAlert(alertEl, "If that email has an account, a reset link is on its way. Check your inbox.", "success");
});
</script>
</body>
</html>
