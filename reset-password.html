<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set New Password</title>
<link href="assets/vendor/bootstrap.min.css" rel="stylesheet">
<link href="assets/css/app.css" rel="stylesheet">
</head>
<body>
<div class="ne-auth-wrap"><div class="ne-auth-card">
  <div class="ne-logo" aria-hidden="true">NE</div>
  <h1>NYOTA ELECTRONICS</h1>
  <p class="subtitle">Choose a new password</p>
  <div id="alert" class="alert d-none" role="alert"></div>
  <form id="form" class="d-none" novalidate>
    <div class="mb-3"><label class="form-label" for="password">New password</label>
      <input class="form-control" id="password" type="password" autocomplete="new-password" maxlength="72" required>
      <div class="form-text">At least 8 characters, with a letter and a number.</div></div>
    <div class="mb-4"><label class="form-label" for="confirm">Confirm password</label>
      <input class="form-control" id="confirm" type="password" autocomplete="new-password" maxlength="72" required></div>
    <button class="btn btn-ne" id="submit" type="submit">Update password</button>
  </form>
  <div class="ne-auth-links"><a href="customer/login.html">Customer login</a><a href="staff/login.html">Staff login</a></div>
</div></div>
<script src="assets/vendor/supabase.js"></script>
<script type="module">
import { sb, backendProblem } from "./js/supabase-client.js";
import { signOutAndGo, getProfile } from "./js/auth.js";
import { validatePassword, showAlert, setBusy, setFieldError } from "./js/validation.js";
const $ = (id) => document.getElementById(id);
const alertEl = $("alert"), btn = $("submit"), form = $("form");
const problem = backendProblem();
if (problem) showAlert(alertEl, problem, "warning");
else {
  // The emailed link opens this page with a recovery session; only then show the form.
  let shown = false;
  const show = () => { if (!shown) { shown = true; form.classList.remove("d-none"); showAlert(alertEl, ""); } };
  sb.auth.onAuthStateChange((ev) => { if (ev === "PASSWORD_RECOVERY") show(); });
  setTimeout(() => { if (!shown) showAlert(alertEl, "This reset link is invalid or has expired. Request a new one from the login page.", "warning"); }, 2500);
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pw = $("password").value, cf = $("confirm").value;
  const e1 = validatePassword(pw), e2 = pw === cf ? "" : "Passwords do not match.";
  setFieldError($("password"), e1); setFieldError($("confirm"), e2);
  if (e1 || e2) return;
  setBusy(btn, true, "Updating...");
  const { error } = await sb.auth.updateUser({ password: pw });
  if (error) { setBusy(btn, false); return showAlert(alertEl, "Could not update the password. The link may have expired; request a new one."); }
  const profile = await getProfile();
  const dest = profile && profile.role !== "customer" ? "staff/login.html" : "customer/login.html";
  await signOutAndGo(dest);
});
</script>
</body>
</html>
